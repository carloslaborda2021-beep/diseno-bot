<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café de altura</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="bg-[#E5E5CB] text-[#1A120B]" style="font-family:Outfit,sans-serif">
  <header class="mx-auto flex max-w-5xl justify-between px-5 py-5"><p style="font-family:Fraunces,serif" class="text-xl">Altura</p><nav class="flex gap-5 text-sm text-[#3C2A21]"><a href="#origen">Origen</a><a class="text-[#C45C26]" href="#pedir">Pedir</a></nav></header>
  <section class="mx-auto max-w-5xl px-5 py-12">
    <p class="text-xs uppercase tracking-[0.28em] text-[#3C2A21]">Origen único · 1.850 m</p>
    <h1 class="mt-4 text-5xl leading-none" style="font-family:Fraunces,serif">Café de altura,<br>tueste lento.</h1>
    <p class="mt-5 max-w-md text-[#3C2A21]">Lotes pequeños. Notas a cacao, pan tostado y cítricos secos.</p>
    <div class="mt-8 flex gap-3">
      <a class="rounded-xl bg-[#C45C26] px-5 py-3 text-sm text-[#E5E5CB]" href="#pedir">Pedir ahora</a>
      <a class="rounded-xl border border-[#3C2A21] px-5 py-3 text-sm" href="#origen">Ver origen</a>
    </div>
  </section>
  <div class="grid h-20 grid-cols-5"><div class="bg-[#1A120B]"></div><div class="bg-[#3C2A21]"></div><div class="bg-[#D5BDAF]"></div><div class="bg-[#E5E5CB]"></div><div class="bg-[#C45C26]"></div></div>
</body>
</html>
